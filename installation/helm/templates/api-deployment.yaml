apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marble.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marble.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.apiServer.replicas }}
  selector:
    matchLabels:
      {{- include "marble.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "marble.labels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.apiServer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "marble.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "marble.backendImage" . }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command: ["/app"]
          args: ["--server"]
          ports:
            - name: http
              containerPort: {{ .Values.common.port }}
              protocol: TCP
          env:
            {{- include "marble.backendEnv" (dict "ctx" . "component" "server") | nindent 12 }}
          {{- $mounts := include "marble.secretVolumeMounts" (dict "ctx" . "component" "server") | trim }}
          {{- with $mounts }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          # /health always returns 200 -> good liveness signal (process up, not DB-coupled).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # /liveness runs SELECT 1 -> readiness (pull out of rotation when DB unreachable).
          readinessProbe:
            httpGet:
              path: /liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.apiServer.resources | nindent 12 }}
      {{- $volumes := include "marble.secretVolumes" (dict "ctx" . "component" "server") | trim }}
      {{- with $volumes }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

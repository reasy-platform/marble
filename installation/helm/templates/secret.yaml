{{- if not .Values.secrets.existingSecret -}}
{{- /*
  Chart-managed Secret. Only non-empty values are rendered, so the same chart works
  whether a given credential is supplied here (via Terraform `set`) or omitted.
  When `secrets.existingSecret` is set this whole object is skipped and the chart
  references that Secret instead — it MUST carry the keys used below.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "marble.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marble.labels" (dict "ctx" . "component" "shared") | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.connectionString }}
  PG_CONNECTION_STRING: {{ .Values.postgres.connectionString | quote }}
  {{- end }}
  {{- if .Values.postgres.password }}
  PG_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
  {{- if .Values.auth.firebase.apiKey }}
  FIREBASE_API_KEY: {{ .Values.auth.firebase.apiKey | quote }}
  {{- end }}
  {{- if and .Values.auth.firebase.serviceAccount.enabled .Values.auth.firebase.serviceAccount.json }}
  GCP_SERVICE_ACCOUNT_JSON: {{ .Values.auth.firebase.serviceAccount.json | quote }}
  {{- end }}
  {{- if .Values.screening.opensanctions.apiKey }}
  SCREENING_OPENSANCTIONS_API_KEY: {{ .Values.screening.opensanctions.apiKey | quote }}
  {{- end }}
  {{- if .Values.frontend.session.secret }}
  SESSION_SECRET: {{ .Values.frontend.session.secret | quote }}
  {{- end }}
  {{- if and (not .Values.storage.aws.useIrsa) .Values.storage.aws.accessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.storage.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.storage.aws.secretAccessKey | quote }}
  {{- end }}
  {{- if and .Values.apiServer.jwtSigningKey.enabled .Values.apiServer.jwtSigningKey.pem }}
  AUTHENTICATION_JWT_SIGNING_KEY: {{ .Values.apiServer.jwtSigningKey.pem | quote }}
  {{- end }}
  {{- if .Values.license.key }}
  LICENSE_KEY: {{ .Values.license.key | quote }}
  {{- end }}
  {{- if .Values.observability.sentry.dsn }}
  SENTRY_DSN: {{ .Values.observability.sentry.dsn | quote }}
  {{- end }}
{{- end }}

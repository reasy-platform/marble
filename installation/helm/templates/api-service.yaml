apiVersion: v1
kind: Service
metadata:
  name: {{ include "marble.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marble.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.common.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "marble.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}

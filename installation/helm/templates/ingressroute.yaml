{{- if .Values.ingressRoute.enabled -}}
{{- /*
  Traefik IngressRoute (traefik.io/v1alpha1) — matches the reasy-infra-apps convention.
  Only the frontend is exposed publicly; api-server/worker stay on internal ClusterIP.
  By convention this is often authored in Terraform as a kubernetes_manifest instead
  (see examples/helm_marble.tf); keep this disabled if Terraform owns it.
*/ -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "marble.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marble.labels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingressRoute.ingressClass | quote }}
    {{- with .Values.ingressRoute.externalDnsTarget }}
    external-dns.alpha.kubernetes.io/target: {{ . | quote }}
    {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ required "ingressRoute.host is required when ingressRoute.enabled=true" .Values.ingressRoute.host }}`)
      kind: Rule
      services:
        - name: {{ include "marble.fullname" . }}-frontend
          port: {{ .Values.common.port }}
    {{- if .Values.ingressRoute.publicApi.enabled }}
    # Marble programmatic public API exposed to external clients.
    - match: Host(`{{ .Values.ingressRoute.host }}`) && ({{ range $i, $p := .Values.ingressRoute.publicApi.pathPrefixes }}{{ if $i }} || {{ end }}PathPrefix(`{{ $p }}`){{ end }})
      kind: Rule
      services:
        - name: {{ include "marble.fullname" . }}-api
          port: {{ .Values.common.port }}
    {{- end }}
  tls:
    certResolver: {{ .Values.ingressRoute.tls.certResolver | quote }}
{{- end }}

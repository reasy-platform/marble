apiVersion: v2
name: marble-reasy
description: |
  Marble (fraud/AML transaction monitoring & screening) for Kubernetes.
  Tailored deploy profile: EXTERNAL PostgreSQL, EXTERNAL OpenSanctions SaaS
  (no Elasticsearch/yente/motiva), Firebase auth, S3 blob storage, routed via a
  Traefik IngressRoute.
type: application
# Chart version — bump on chart changes.
version: 0.2.0
# Marble backend/frontend image tag this chart targets (env-var behaviour verified against v1.12.0).
appVersion: "v1.12.0"
home: https://www.checkmarble.com/
sources:
  - https://github.com/checkmarble/marble
  - https://github.com/checkmarble/marble-backend
  - https://github.com/checkmarble/marble-frontend
maintainers:
  - name: REasy
